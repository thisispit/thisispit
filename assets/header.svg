<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Welcome to Pitamber's Github</title>
  <desc id="desc">Monochrome animated header background with centered title.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030305" />
      <stop offset="50%" stop-color="#101114" />
      <stop offset="100%" stop-color="#050507" />
      <animate attributeName="x1" values="0%;8%;0%" dur="24s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;92%;100%" dur="24s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="titleFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a1a1aa" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="kanjiBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <pattern id="noise" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M0 72 L72 0" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
      <path d="M-18 54 L18 90 M54 -18 L90 18" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
    <clipPath id="typingClip">
      <rect x="390" y="168" width="0" height="34">
        <animate attributeName="width" values="0;620" dur="3.6s" begin="1s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect width="1400" height="320" fill="url(#bg)" />
  <rect width="1400" height="320" fill="url(#noise)" opacity="0.08">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="12s" repeatCount="indefinite" />
  </rect>

  <g filter="url(#softBlur)" opacity="0.9">
    <circle cx="180" cy="84" r="126" fill="#222326">
      <animate attributeName="cx" values="170;210;170" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;94;80" dur="16s" repeatCount="indefinite" />
    </circle>
    <circle cx="1180" cy="238" r="154" fill="#17181b">
      <animate attributeName="cx" values="1168;1210;1168" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="230;248;230" dur="18s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Faint kanji watermark 道 (path/way) -->
  <text x="1260" y="290" text-anchor="middle" fill="#ffffff" fill-opacity="0.04"
    font-family="serif" font-size="260" font-weight="900" filter="url(#kanjiBlur)">道</text>

  <rect width="1400" height="320" fill="none" stroke="#ffffff" stroke-opacity="0.05" />

  <text x="700" y="154" text-anchor="middle" fill="url(#titleFill)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="0.8" opacity="0">
    Welcome to Pitamber's Github
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze" />
  </text>

  <text x="700" y="196" text-anchor="middle" fill="#a1a1aa" font-family="Consolas, Monaco, monospace" font-size="22" font-weight="400" letter-spacing="2" clip-path="url(#typingClip)">
    Java · Spring Boot · DSA · System Design
  </text>

  <rect x="390" y="172" width="3" height="24" fill="#e4e4e7" opacity="0.9">
    <animate attributeName="x" values="390;1010" dur="3.6s" begin="1s" fill="freeze" />
    <animate attributeName="opacity" values="0;1;0;1;0.2" dur="0.9s" begin="1s" repeatCount="indefinite" />
  </rect>
</svg>
