<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Pitamber Kumar Singh</title>
  <desc id="desc">Animated header with moving gradient and drifting glow shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6b7280" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1400" height="320" fill="url(#bg)" />

  <g filter="url(#blur)" opacity="0.65">
    <circle cx="220" cy="90" r="90" fill="#374151">
      <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;70;100" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle cx="1120" cy="230" r="120" fill="#1f2937">
      <animate attributeName="cx" values="1080;1160;1080" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="220;250;220" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="720" cy="70" r="70" fill="#4b5563">
      <animate attributeName="cy" values="60;95;60" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <rect width="1400" height="320" fill="none" stroke="#ffffff" stroke-opacity="0.08" />

  <g opacity="0.2">
    <path d="M0 250 C 160 210, 280 310, 440 270 S 760 220, 920 270 S 1240 310, 1400 240" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M0 270 C 180 240, 300 320, 480 286 S 760 250, 980 286 S 1240 320, 1400 260" fill="none" stroke="#9ca3af" stroke-width="1.5" />
  </g>

  <circle cx="1180" cy="92" r="90" fill="url(#orb)" opacity="0.16">
    <animate attributeName="cx" values="1140;1210;1140" dur="9s" repeatCount="indefinite" />
  </circle>

  <text x="700" y="152" text-anchor="middle" fill="url(#accent)" opacity="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0.5">
    Pitamber Kumar Singh
    <animate attributeName="opacity" values="0;1" dur="1.8s" fill="freeze" />
  </text>
  <text x="700" y="196" text-anchor="middle" fill="#9ca3af" opacity="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="3">
    Java Developer | DSA | Problem Solver
    <animate attributeName="opacity" values="0;1" dur="2.4s" fill="freeze" />
  </text>
</svg>
